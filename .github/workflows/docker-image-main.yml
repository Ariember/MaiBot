name: Publish GHCR Images

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Image update channel
        type: choice
        options: [latest, dev]
        default: latest

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-updater:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest tomlkit
      - run: python -m pytest pytests/startup_test/test_image_update.py -q

  build:
    needs: verify-updater
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - {name: amd64, runner: ubuntu-24.04, platform: linux/amd64}
          - {name: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64}
        image:
          - {name: maibot, target: runtime}
          - {name: maibot-updater, target: updater}
    runs-on: ${{ matrix.architecture.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Image coordinates
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=ghcr.io/${OWNER,,}/${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"
          echo "version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.image.target }}
          platforms: ${{ matrix.architecture.platform }}
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-${{ matrix.architecture.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.target }}-${{ matrix.architecture.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.target }}-${{ matrix.architecture.name }}

  publish:
    needs: build
    strategy:
      matrix:
        image: [maibot, maibot-updater]
    runs-on: ubuntu-24.04
    steps:
      - name: Image coordinates
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ (github.event_name != 'workflow_dispatch' && (github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/'))) || inputs.channel == 'latest' }}
            type=raw,value=dev,enable=${{ (github.event_name != 'workflow_dispatch' && github.ref_name == 'dev') || inputs.channel == 'dev' }}
      - name: Publish multi-platform manifests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          REVISION: ${{ github.sha }}
        run: |
          while IFS= read -r tag; do
            docker buildx imagetools create -t "$tag" \
              "$IMAGE:sha-$REVISION-amd64" "$IMAGE:sha-$REVISION-arm64"
          done <<< "$TAGS"
