name: Ruff PR Check
on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ruff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Ruff and Run Checks
        uses: astral-sh/ruff-action@v3
        with:
          args: "--version"
          version: "0.15.11"
      - name: Run Ruff Check (No Fix)
        run: ruff check --output-format=github
        shell: pwsh
      - name: Run Ruff Format Check
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python .github/scripts/check_ruff_format_regressions.py --baseline-ref "$env:BASE_REF"
        shell: pwsh
